<!DOCTYPE html>

    <b>EduBuddy</b>
    <span>Teman Belajar Dimanapun</span>

  <!-- Application Shell -->
  <div id="app">
    <!-- Top Header -->
    <header id="hd">
      <div class="h-16 px-5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTYiIGZpbGw9IiMxMEI5ODEiLz48cGF0aCBkPSJNMTQgMjJjMC00IDMtNyA3LTdoMjJjNCAwIDcgMyA3IDd2MTRjMCA0LTMgNy03IDdIMzBsLTkgN3YtN2MtNCAwLTctMy03LTd6IiBmaWxsPSIjZmZmIi8+PHBhdGggZD0iTTMyIDI0Yy0zLTItNy0yLTEwLTF2MTNjMy0xIDctMSAxMCAxIDMtMiA3LTIgMTAtMVYyM2MtMy0xLTctMS0xMCAxeiIgZmlsbD0iIzEwQjk4MSIvPjxwYXRoIGQ9Ik0zMiAyNHYxMyIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiLz48L3N2Zz4=" class="h-8 w-8" alt="EduBuddy Logo">

            <h1 id="ttl" class="font-headline-sm font-semibold">Beranda</h1>
          </div>
        </div>
        <div class="flex items-center">
          <button data-act="notif" aria-label="Notifikasi" class="w-12 h-12 flex items-center justify-center rounded-full">
            <span class="material-symbols-outlined">notifications</span>
          </button>
          <button data-path="profil" aria-label="Profil" class="w-12 h-12 flex items-center justify-center">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiBmaWxsPSIjMTBCOTgxIi8+PGNpcmNsZSBjeD0iMzIiIGN5PSIyNSIgcj0iMTEiIGZpbGw9IiNmZmYiIG9wYWNpdHk9Ii45Ii8+PHBhdGggZD0iTTEwIDY0YzItMTUgMTItMjIgMjItMjJzMjAgNyAyMiAyMnoiIGZpbGw9IiNmZmYiIG9wYWNpdHk9Ii45Ii8+PC9zdmc+" class="w-8 h-8 rounded-full ring-2 ring-primary/20" alt="Avatar">
          </button>
        </div>
      </div>
    </header>

    <!-- Main View Container -->
    <main id="view" class="pt-16 pb-28 px-5"></main>

    <!-- Bottom Navigation Bar -->
    <nav id="nv">
      <div class="flex justify-around py-2">
        <button data-path="beranda" data-nav="beranda" class="flex flex-col items-center gap-0.5 px-3 py-1 text-outline min-w-[60px]">
          <span class="material-symbols-outlined px-4 py-1 rounded-full">home</span>
          <span class="text-[11px] font-semibold">Beranda</span>
        </button>
        <button data-path="belajar" data-nav="belajar" class="flex flex-col items-center gap-0.5 px-3 py-1 text-outline min-w-[60px]">
          <span class="material-symbols-outlined px-4 py-1 rounded-full">local_library</span>
          <span class="text-[11px] font-semibold">Belajar</span>
        </button>
        <button data-path="aman" data-nav="aman" class="flex flex-col items-center gap-0.5 px-3 py-1 text-outline min-w-[60px]">
          <span class="material-symbols-outlined px-4 py-1 rounded-full">shield</span>
          <span class="text-[11px] font-semibold">Aman</span>
        </button>
        <button data-path="jadwal" data-nav="jadwal" class="flex flex-col items-center gap-0.5 px-3 py-1 text-outline min-w-[60px]">
          <span class="material-symbols-outlined px-4 py-1 rounded-full">event_available</span>
          <span class="text-[11px] font-semibold">Jadwal</span>
        </button>
        <button data-path="profil" data-nav="profil" class="flex flex-col items-center gap-0.5 px-3 py-1 text-outline min-w-[60px]">
          <span class="material-symbols-outlined px-4 py-1 rounded-full">account_circle</span>
          <span class="text-[11px] font-semibold">Profil</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Modular Application Entry Point -->
  <script type="module" src="src/core/app.js"></script>
</body>
</html>
